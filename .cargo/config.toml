# Cargo configuration for the thumbv8m.main-none-eabihf (RP2350 Arm,
# Cortex-M33) bare-metal target.
[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
rustflags = [
    # Disable page alignment of sections; keeps the image compact.
    "-C", "link-arg=--nmagic",
    # link.x comes from cortex-m-rt and includes our memory.x.
    "-C", "link-arg=-Tlink.x",
    "-C", "target-cpu=cortex-m33",
]
# Loads over USB when the board is in BOOTSEL mode, then reboots it.
runner = "picotool load -u -v -x -t elf"

# Silence the end-of-build future-incompatibility notice (currently
# triggered by proc-macro-error2 via pio-proc, build-time-only code
# with no effect on the firmware). The data is still recorded: run
# `cargo report future-incompatibilities` to review it, and check
# again when bumping pio/rp235x-hal versions.
[future-incompat-report]
frequency = "never"
