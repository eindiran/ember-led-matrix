# Cargo configuration for the thumbv8m.main-none-eabihf (RP2350 Arm,
# Cortex-M33) bare-metal target.
[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
rustflags = [
    # Disable page alignment of sections; keeps the image compact.
    "-C", "link-arg=--nmagic",
    # link.x comes from cortex-m-rt and includes our memory.x.
    "-C", "link-arg=-Tlink.x",
    "-C", "target-cpu=cortex-m33",
]
# Loads over USB when the board is in BOOTSEL mode, then reboots it.
runner = "picotool load -u -v -x -t elf"
