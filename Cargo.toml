# Firmware for the Waveshare RP2350-Matrix: renders a glowing-ember
# effect on the onboard 8x8 WS2812B LED matrix. Bare-metal (no_std)
# rp235x-hal application.
[package]
name = "ember-led-matrix"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# No test harness: this is a no_std bare-metal binary, so the default
# libtest-based targets cannot build for thumbv8m.main-none-eabihf.
[[bin]]
name = "ember-led-matrix"
path = "src/main.rs"
test = false
bench = false

[dependencies]
rp235x-hal = { version = "0.4.0", features = [
    # Cortex-M runtime and the #[hal::entry] macro.
    "rt",
    # critical-section implementation required by Peripherals::take().
    "critical-section-impl",
    # Picotool binary-info support (linker sections in memory.x).
    "binary-info",
] }
# PIO instruction assembler used to build the WS2812 program at startup.
pio = "0.3"
# DelayNs trait implemented by the HAL timer, used for frame pacing.
embedded-hal = "1.0"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
